[project]
name = "me5418-rocket-league"
version = "0.1.0"
description = "2D Rocket League simulation, Gymnasium environment and DQN / PPO learning agents (ME5418 Group 41)"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["runs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E501", # line length is the formatter's job
    "E741", # `l` is the conventional name for a logits tensor in this codebase
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "slow: CLI smoke tests and short training runs (deselect with -m 'not slow')",
]
filterwarnings = [
    "ignore::DeprecationWarning:pygame.*",
]
