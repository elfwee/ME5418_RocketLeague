# Exact environment the project was developed and tested in.
#   conda env create -f environment.yml
#   conda activate me5418_projenv
# conda-forge only: Anaconda's "defaults" channel needs its Terms of Service accepted on new conda installs.
name: me5418_projenv
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy=1.26.4
  - matplotlib=3.11.2
  - pillow=13.0.0
  - pip
  - pip:
      - torch==2.15.0
      - gymnasium==1.4.0
      - pygame==2.6.1
      - pymunk==7.3.1
